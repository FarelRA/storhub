version: "2"

linters:
  enable:
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  exclusions:
    rules:
      # The console toolchain is bun (never node/npm), but bun still creates
      # web/node_modules, so keep this revive exclusion scoped to that dir.
      - path: web/node_modules/
        linters: [revive]

formatters:
  enable:
    - gofmt
