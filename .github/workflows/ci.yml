name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: timer-shape guardrail
        run: |
          # Event-purity gate: no polling timers or raw sleeps in prod.
          # Bounds use context/SleepWithContext, waits use injected sleep,
          # coalescing uses AfterFunc with a paired flush/stop. Any hit
          # below is a regression: justify it in 22-event-purity-plan.md
          # or route it through the approved shape.
          hits=$(grep -rn --include='*.go' -E 'time\.Sleep|time\.NewTicker|[^.]Tick\(' internal/ cmd/ fuse/ rest/ storhub/ | grep -v _test || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned so an action-default bump cannot silently change the
          # lint gate. Keep in sync with .golangci.yml (config version 2).
          version: v2.13.2
          args: --timeout=10m
      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck examples/cli/demo.sh scripts/install.sh

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned exact, never `latest`: the web bundle is not hermetic
          # (chunk hashes drift by arch and bun version), so a floating
          # toolchain would churn every build log and risk phantom diffs.
          bun-version: 1.4.2
      - name: install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: lint
        working-directory: web
        run: bun run lint
      - name: unit tests
        working-directory: web
        run: bun run test
      - name: typecheck
        working-directory: web
        run: bun run typecheck
      - name: production build and embed
        # build:embed runs `nuxt generate` and copies the bundle into
        # internal/rest/static/dist (the directory go build ships).
        working-directory: web
        run: bun run build:embed
      - name: verify the embedded bundle is non-empty
        # The committed internal/rest/static/dist is a convenience so Go-only
        # checkouts build; the release workflow rebuilds it from source in a
        # pinned environment. A byte-for-byte CI diff against it is NOT
        # meaningful: the bundle is not hermetic (esbuild output varies by CPU
        # arch and bun version), so this only asserts the production build
        # produced a real SPA rather than the placeholder, catching a broken
        # web build without false-failing on toolchain drift.
        run: |
          test -s internal/rest/static/dist/index.html || { echo "::error::embedded index.html missing or empty"; exit 1; }
          chunks=$(ls internal/rest/static/dist/_nuxt/*.js 2>/dev/null | wc -l | tr -d ' ')
          if [ "${chunks:-0}" -lt 1 ]; then echo "::error::no _nuxt JS chunks in the bundle"; exit 1; fi
          echo "bundle OK: index.html present, ${chunks} JS chunk(s)"

  test-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # PR fast path: -short skips the long integration suites (the ones
      # honoring testing.Short()); the full non-race sweep still runs on
      # every push to main and on nightly, so coverage is not lost.
      # Default build parallelism (-p=NumCPU) is used deliberately: a
      # serialized -p=1 build only wastes wall time.
      - name: test (PR fast path)
        if: github.event_name == 'pull_request'
        run: go test -short -count=1 ./...
      - name: test
        if: github.event_name != 'pull_request'
        run: go test -count=1 ./...

  race-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # -race only pays off where there is concurrency to catch, so the PR
      # gate instruments the concurrency-sensitive packages (storage,
      # github, fusefs, rest, cli). The FULL -race sweep over ./... runs
      # nightly (nightly.yml), so coverage is not lost.
      - name: race (concurrency-sensitive packages)
        run: >
          go test -race -count=1
          ./internal/storage/...
          ./internal/github/...
          ./internal/fusefs/...
          ./internal/rest/...
          ./rest/...
          ./internal/cli/...

  test-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: test (PR fast path)
        if: github.event_name == 'pull_request'
        run: go test -short -count=1 ./...
      - name: test
        if: github.event_name != 'pull_request'
        run: go test -count=1 ./...

  race-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: race (concurrency-sensitive packages)
        run: >
          go test -race -count=1
          ./internal/storage/...
          ./internal/github/...
          ./internal/fusefs/...
          ./internal/rest/...
          ./rest/...
          ./internal/cli/...

  benchmark-budgets:
    # POSIX hot-path budgets (internal/posixconform/budgets_test.go): the
    # FUSE benches need /dev/fuse and the ceilings were baselined on
    # linux/amd64, so this stays on ubuntu-24.04 and never fans out to
    # arm64 or cross builds. STORHUB_BENCH=1 opts the enforcement in; a
    # plain `go test` only checks the budget table itself.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: benchmark budgets
        env:
          STORHUB_BENCH: "1"
        run: go test -count=1 -run 'TestBudgetTableSane|TestBenchmarkBudgets' -v ./internal/posixconform/

  build-cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm, goarm: "6" }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: cross-compile
        # -o is mandatory: the default binary name ("storhub") collides
        # with the storhub/ facade package directory at the repo root.
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/examples"
          go build -o "$RUNNER_TEMP/bin/" ./cmd/storhub
          go build -o "$RUNNER_TEMP/examples/" ./examples/...

  test-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go vet ./examples/... && go test -count=1 ./examples/...
