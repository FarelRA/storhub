name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned so an action-default bump cannot silently change the
          # lint gate. Keep in sync with .golangci.yml (config version 2).
          version: v2.13.2
          args: --timeout=10m
      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck examples/cli/demo.sh scripts/install.sh

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: lint
        working-directory: web
        run: bun run lint
      - name: unit tests
        working-directory: web
        run: bun run test
      - name: typecheck
        working-directory: web
        run: bun run typecheck
      - name: production build and embed
        # build:embed runs `nuxt generate` and copies the bundle into
        # internal/rest/static/dist (the directory go build ships).
        working-directory: web
        run: bun run build:embed
      - name: verify embed is in sync with web source
        # Fail if the committed bundle drifted: go build and docker build
        # ship internal/rest/static/dist, so a web change without build:embed
        # would silently serve a stale console. Nuxt stamps a random build id
        # into builds/latest.json, builds/meta/<uuid>.json and the HTML
        # shells, so those are non-deterministic run-to-run and are excluded.
        # The _nuxt/*.js and _nuxt/*.css chunks are content-hashed and stable,
        # so they are the real drift signal: any web source change alters at
        # least one chunk name, which this diff catches.
        run: |
          git add -A internal/rest/static/dist
          if ! git diff --cached --exit-code --stat -- \
              'internal/rest/static/dist/_nuxt/*.js' \
              'internal/rest/static/dist/_nuxt/*.css'; then
            echo "::error::internal/rest/static/dist chunks are stale: run 'bun run build:embed' in web/ and commit the result"
            exit 1
          fi

  test-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...

  race-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  test-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...

  race-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  build-cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm, goarm: "6" }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: cross-compile
        # -o is mandatory: the default binary name ("storhub") collides
        # with the storhub/ facade package directory at the repo root.
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/examples"
          go build -o "$RUNNER_TEMP/bin/" ./cmd/storhub
          go build -o "$RUNNER_TEMP/examples/" ./examples/...

  test-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./examples/... && go test -count=1 ./examples/...
