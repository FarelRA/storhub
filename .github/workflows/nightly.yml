name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...

  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # govulncheck-action performs its own internal setup-go; a second
          # cache restore over the populated GOMODCACHE spams tar
          # "Cannot open: File exists" annotations.
          cache: false
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: ""
          go-package: ./...

  publish:
    needs: [gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install syft
        uses: anchore/sbom-action/download-syft@v0
      - name: goreleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --snapshot --clean --parallelism=8
      - name: delete previous nightly
        # Recreate from scratch every run: deleting the release together
        # with its tag guarantees exactly one generation of assets and a
        # nightly tag that always points at the newest main commit. The
        # publish step below recreates both at GITHUB_SHA.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --cleanup-tag --yes || true
      - name: publish nightly
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: nightly
          prerelease: true
          make_latest: false
          files: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error
