version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The Nuxt console: web/bun.lock. Dependabot reads bun lockfiles under
  # the npm ecosystem.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
